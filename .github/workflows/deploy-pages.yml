name: Deploy site to GitHub Pages

# site/ にコミットされた Unity の Web ビルドをそのまま Pages に配信する。
# ビルド自体は手元で tools/build_web.sh --deploy が行う（Unity のライセンスが CI に無いため）。
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stamp deploy number
        run: |
          echo "run=${{ github.run_number }} sha=${GITHUB_SHA::7} at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" > site/deploy.txt
          ls -la site | head -20

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
