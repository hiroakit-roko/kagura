# main に push するたびに Godot 4.7.1 で Web 版を書き出し、GitHub Pages に公開する。
name: Deploy Web build to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.1

jobs:
  export-web:
    name: Export Web (Godot 4.7.1)
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Move export templates into place
        # コンテナ内では HOME が /github/home になるので、イメージ同梱のテンプレートを移す
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/

      - name: Stamp build version
        # 版はデプロイごとに必ず上がる（実行番号）。記録にどの版で遊んだかが残る
        run: |
          VERSION="1.${{ github.run_number }}"
          printf '[build]\nversion="%s"\ncommit="%s"\ntime="%s"\n' "$VERSION" "${GITHUB_SHA::7}" "$(date -u +%Y-%m-%dT%H:%MZ)" > build.cfg
          cat build.cfg

      - name: Import assets
        run: godot --headless --path . --import || true

      - name: Export Web
        run: |
          mkdir -v -p build/web
          godot --headless --path . --export-release Web build/web/index.html
          ls -la build/web

      - name: Disable Jekyll processing
        run: touch build/web/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Deploy to GitHub Pages
    needs: export-web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
